name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # npm and its install scripts run in this job only: it gets no signing key
  web:
    runs-on: ubuntu-latest
    name: Dashboard build
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RiDDiX/ulrmm-web
          ref: ${{ github.ref_name }}
          path: ulrmm-web
          token: ${{ secrets.WEB_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ulrmm-web/package-lock.json

      - name: Build
        working-directory: ulrmm-web
        run: npm ci && npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: ulrmm-web/dist
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    name: Release
    needs: web
    # Gitea Actions would run this too, the GitHub release needs GitHub
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RiDDiX/ulrmm-web
          ref: ${{ github.ref_name }}
          path: ulrmm-web
          token: ${{ secrets.WEB_REPO_TOKEN || github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: ulrmm-web/dist

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the signing library
        run: |
          python3 -m pip install --only-binary=:all: "$(grep -x 'cryptography==[0-9.]*' api/ulrmm/requirements.txt)"

      - name: Pack and sign the assets
        env:
          ULRMM_RELEASE_KEY: ${{ secrets.ULRMM_RELEASE_KEY }}
        run: bash riddix/scripts/release_build.sh "${GITHUB_REF_NAME#v}" --web-dir ulrmm-web --prebuilt --out dist

      # a wrong ULRMM_RELEASE_KEY secret would publish a release no server accepts
      - name: Check the signature against the pinned key
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'EOF'
          import base64, re, sys
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          pinned = re.search(r'^RELEASE_PUBKEY_B64 = "([^"]+)"', open("api/ulrmm/core/releases.py").read(), re.M)
          manifest = open(f"dist/ulrmm-{sys.argv[1]}.manifest.json", "rb").read()
          sig = open(f"dist/ulrmm-{sys.argv[1]}.manifest.sig").read().strip()
          Ed25519PublicKey.from_public_bytes(base64.b64decode(pinned.group(1))).verify(base64.b64decode(sig), manifest)
          print("signature matches the pinned key")
          EOF

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes "UniversalLocal RMM ${GITHUB_REF_NAME#v}" dist/ulrmm-*

      - name: Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          if [ -z "$GITEA_TOKEN" ]; then
            echo "GITEA_TOKEN is not set, no Gitea release"
            exit 0
          fi
          api=https://git.riddix.de/api/v1/repos/RiDDiX/ulrmm/releases
          id=$(curl -fsS -X POST "$api" -H "Authorization: token $GITEA_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\",\"target_commitish\":\"$GITHUB_SHA\",\"body\":\"UniversalLocal RMM ${GITHUB_REF_NAME#v}\"}" | jq -r .id)
          [ -n "$id" ] && [ "$id" != null ] || { echo "Gitea did not create the release"; exit 1; }
          for f in dist/ulrmm-*; do
            curl -fsS -X POST "${api}/${id}/assets?name=$(basename "$f")" \
              -H "Authorization: token $GITEA_TOKEN" -F "attachment=@${f}" >/dev/null
          done

  images:
    runs-on: ubuntu-latest
    name: Images
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: ver
        run: echo "version=$(tr -d '[:space:]' <VERSION)" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/riddix/ulrmm-api:${{ steps.ver.outputs.version }}
            ghcr.io/riddix/ulrmm-api:latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          target: natsapi
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/riddix/ulrmm-natsapi:${{ steps.ver.outputs.version }}
            ghcr.io/riddix/ulrmm-natsapi:latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ULRMM_WEB_REF=${{ github.ref_name }}
          secrets: |
            web_token=${{ secrets.WEB_REPO_TOKEN || github.token }}
          tags: |
            ghcr.io/riddix/ulrmm-nginx:${{ steps.ver.outputs.version }}
            ghcr.io/riddix/ulrmm-nginx:latest

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/mesh/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/riddix/ulrmm-mesh:${{ steps.ver.outputs.version }}
            ghcr.io/riddix/ulrmm-mesh:latest
