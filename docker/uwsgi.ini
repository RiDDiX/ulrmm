# compose stand-in for app.ini (manage.py create_uwsgi_conf): nginx reaches
# the uwsgi protocol on api:8000 instead of the unix socket
[uwsgi]
chdir = /rmm/api/ulrmm
module = ulrmm.wsgi
home = /rmm/api/env
master = true
processes = $(UWSGI_WORKERS)
socket = 0.0.0.0:8000
harakiri = 300
buffer-size = 65535
max-requests = 50
die-on-term = true
enable-threads = true
disable-logging = true
worker-reload-mercy = 30
