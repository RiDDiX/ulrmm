#
# UniversalLocal RMM as containers. Settings come from .env (see .env.example);
# the init service renders local_settings.py and runs the migrations.

x-api-image: &api-image
  image: ghcr.io/riddix/ulrmm-api:${ULRMM_VERSION:?}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: api

x-api-env: &api-env
  ULRMM_LOG_TO: stdout
  ULRMM_LOG_LEVEL: ${ULRMM_LOG_LEVEL:-INFO}
  NATS_STD_BIND_HOST: 0.0.0.0
  NATS_WS_BIND_HOST: 0.0.0.0
  NATS_CONNECT_HOST: nats
  TZ: ${TZ:-UTC}
  API_DOMAIN: ${API_DOMAIN:?}
  APP_DOMAIN: ${APP_DOMAIN:?}
  MESH_DOMAIN: ${MESH_DOMAIN:?}
  MESH_USERNAME: ${MESH_USERNAME:-ulrmm-mesh}

# json-file without limits grows until the disk is full
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-depends: &api-depends
  init:
    condition: service_completed_successfully
  nats:
    condition: service_started
  redis:
    condition: service_healthy
  db:
    condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ulrmm
      POSTGRES_DB: ulrmm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MESH_DB_PASSWORD: ${MESH_DB_PASSWORD:?}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init-mesh.sh:/docker-entrypoint-initdb.d/init-mesh.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulrmm -d ulrmm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "60", "1"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.14.4-alpine
    restart: unless-stopped
    logging: *logging
    command: ["sh", "/reload-watch.sh"]
    volumes:
      - ./nats/reload-watch.sh:/reload-watch.sh:ro
      - conf:/conf:ro
    depends_on:
      init:
        condition: service_completed_successfully

  natsapi:
    image: ghcr.io/riddix/ulrmm-natsapi:${ULRMM_VERSION:?}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: natsapi
    restart: unless-stopped
    logging: *logging
    command: ["/usr/local/bin/nats-api", "-config", "/conf/nats-api.conf"]
    volumes:
      - conf:/conf:ro
    depends_on:
      init:
        condition: service_completed_successfully
      nats:
        condition: service_started
      db:
        condition: service_healthy

  mesh:
    image: ghcr.io/riddix/ulrmm-mesh:${ULRMM_VERSION:?}
    build:
      context: ..
      dockerfile: docker/mesh/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      MESH_DOMAIN: ${MESH_DOMAIN:?}
      MESH_DB_PASSWORD: ${MESH_DB_PASSWORD:?}
      MESH_USERNAME: ${MESH_USERNAME:-ulrmm-mesh}
      MESH_PASSWORD: ${MESH_PASSWORD:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      TZ: ${TZ:-UTC}
    volumes:
      - mesh-data:/meshcentral/meshcentral-data
    depends_on:
      db:
        condition: service_healthy

  init:
    <<: *api-image
    restart: "no"
    command: ["/init.sh"]
    environment:
      <<: *api-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      ULRMM_TLS: ${ULRMM_TLS:-own}
      ULRMM_SCRIPTS_REPO: ${ULRMM_SCRIPTS_REPO:-https://github.com/RiDDiX/ulrmm-scripts.git}
      ULRMM_SCRIPTS_TOKEN: ${ULRMM_SCRIPTS_TOKEN:-}
      ULRMM_AGENT_REPO: ${ULRMM_AGENT_REPO:-https://github.com/RiDDiX/ulrmm-agent.git}
    volumes:
      - settings:/settings
      - conf:/conf
      - private:/rmm/api/ulrmm/ulrmm/private
      - agent-ca:/etc/ulrmm/agent-ca
      - scripts-lib:/opt/ulrmm-community-scripts
      - static:/rmm/api/ulrmm/static
      - mesh-data:/mesh-data:ro
      - certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mesh:
        condition: service_started

  api:
    <<: *api-image
    restart: unless-stopped
    logging: *logging
    command: ["uwsgi", "--ini", "/rmm/docker/uwsgi.ini"]
    environment:
      <<: *api-env
      UWSGI_WORKERS: ${UWSGI_WORKERS:-6}
    volumes:
      - settings:/settings:ro
      - conf:/conf
      - private:/rmm/api/ulrmm/ulrmm/private
      - agent-ca:/etc/ulrmm/agent-ca
      - agents-dist:/opt/ulrmm-agents:ro
      - scripts-lib:/opt/ulrmm-community-scripts
      - certs:/certs:ro
    depends_on: *api-depends

  ws:
    <<: *api-image
    restart: unless-stopped
    logging: *logging
    command: ["uvicorn", "--host", "0.0.0.0", "--port", "8001", "--forwarded-allow-ips=*", "--no-access-log", "ulrmm.asgi:application"]
    environment: *api-env
    volumes:
      - settings:/settings:ro
      - conf:/conf
      - private:/rmm/api/ulrmm/ulrmm/private
      - agent-ca:/etc/ulrmm/agent-ca:ro
      - agents-dist:/opt/ulrmm-agents:ro
      - certs:/certs:ro
    depends_on: *api-depends

  celery:
    <<: *api-image
    restart: unless-stopped
    logging: *logging
    command: ["celery", "-A", "ulrmm", "worker", "--time-limit=86400", "--autoscale=20,2", "-l", "info"]
    environment: *api-env
    volumes:
      - settings:/settings:ro
      - conf:/conf
      - private:/rmm/api/ulrmm/ulrmm/private
      - agent-ca:/etc/ulrmm/agent-ca
      - agents-dist:/opt/ulrmm-agents:ro
      - scripts-lib:/opt/ulrmm-community-scripts
      - certs:/certs:ro
    depends_on: *api-depends

  celerybeat:
    <<: *api-image
    restart: unless-stopped
    logging: *logging
    command: ["celery", "-A", "ulrmm", "beat", "-s", "/tmp/celerybeat-schedule", "-l", "info"]
    environment: *api-env
    volumes:
      - settings:/settings:ro
      - conf:/conf:ro
    depends_on: *api-depends

  # docker compose run --rm agents: POSIX agents into the agents-dist volume.
  # Windows installers need Inno Setup and are not built in the container.
  agents:
    <<: *api-image
    profiles: ["agents"]
    restart: "no"
    working_dir: /rmm
    command: ["bash", "riddix/agents/build_agents.sh"]
    environment:
      <<: *api-env
      ULRMM_AGENT_ROOT: /opt/ulrmm-agents
    volumes:
      - settings:/settings:ro
      - agents-dist:/opt/ulrmm-agents
    depends_on:
      init:
        condition: service_completed_successfully

  nginx:
    image: ghcr.io/riddix/ulrmm-nginx:${ULRMM_VERSION:?}
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
      args:
        ULRMM_WEB_REPO: ${ULRMM_WEB_REPO:-https://github.com/RiDDiX/ulrmm-web.git}
        ULRMM_WEB_REF: ${ULRMM_WEB_REF:-main}
      secrets:
        - web_token
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      APP_DOMAIN: ${APP_DOMAIN:?}
      MESH_DOMAIN: ${MESH_DOMAIN:?}
      ROOT_DOMAIN: ${ROOT_DOMAIN:?}
      ULRMM_TLS: ${ULRMM_TLS:-own}
      TZ: ${TZ:-UTC}
    volumes:
      - certs:/certs
      - agent-ca:/etc/ulrmm/agent-ca:ro
      - private:/rmm/api/ulrmm/ulrmm/private:ro
      - agents-dist:/opt/ulrmm-agents:ro
      - static:/rmm/api/ulrmm/static:ro
    networks:
      default:
        # api, celery and mesh reach the public names inside the stack
        aliases:
          - ${API_DOMAIN:?}
          - ${APP_DOMAIN:?}
          - ${MESH_DOMAIN:?}
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_started
      ws:
        condition: service_started
      mesh:
        condition: service_started
      nats:
        condition: service_started

# ULRMM_WEB_TOKEN from .env, read by the nginx build when the dashboard repo
# needs access; empty is fine
secrets:
  web_token:
    environment: ULRMM_WEB_TOKEN

volumes:
  settings:
  conf:
  private:
  agent-ca:
  agents-dist:
  scripts-lib:
  mesh-data:
  certs:
  pgdata:
  redis-data:
  static:
